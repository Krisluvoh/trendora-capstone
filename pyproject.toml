[project]
name = "trendora"
version = "0.1.0"
description = "Multi-agent hype-cycle sales concierge prototype (Intake / Research / Recommendation) — CAP 931 capstone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "langchain-groq>=1.1.3",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core checks. I: import sorting. UP: modernize
# syntax for the target Python version. B: common bug patterns (flake8-bugbear).
select = ["E", "F", "I", "UP", "B"]

